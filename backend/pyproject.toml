[project]
name = "aureon-api"
version = "0.1.0"
description = "Commerce API for Aureon Store"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]==0.162.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
